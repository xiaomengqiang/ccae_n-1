<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HC 公共组件 · 视觉评审</title><style>@@FONT_CSS@@
*{box-sizing:border-box}body{margin:0;background:#101113;color:#e8e8ea;font:14px Harmony,-apple-system,"PingFang SC",sans-serif}button,textarea{font:inherit}button{cursor:pointer;color:#d3d5dc;background:#25272c;border:1px solid #41454f;border-radius:6px;padding:8px 12px}button[aria-pressed=true]{background:#163e69;border-color:#4c8ed4;color:#fff}header.review-header{height:72px;padding:0 24px;display:flex;align-items:center;gap:18px;border-bottom:1px solid #33363c}header.review-header strong{font-size:18px}header.review-header span{color:#969ca8;font-size:12px}header.review-header a{color:#95baf0;margin-left:auto;text-decoration:none}.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 72px)}#categories{padding:20px 10px;border-right:1px solid #303238;display:flex;flex-direction:column;gap:6px}#categories button{background:none;border-color:transparent;text-align:left;padding:12px 14px}#categories button span{color:#747c8c;font-size:12px;margin-right:12px}#categories button[aria-current=true]{background:#252c38;border-color:#3d516e}main{padding:26px;min-width:0}h1{font-size:22px;margin:0 0 8px}#component-summary{color:#a1a7b2;line-height:1.7;margin:0}.top-row{display:flex;justify-content:space-between;gap:12px}.small{font-size:12px;color:#939aa6}#states{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.comparison-controls{display:flex;align-items:center;gap:8px;margin-bottom:12px}.comparison-controls label{margin-left:auto;font-size:12px;color:#b8bcc7}#comparison{display:grid;grid-template-columns:1fr 1fr;gap:16px}#comparison>article{min-width:0;border:1px solid #36383e;border-radius:10px;overflow:hidden;background:#202124}.preview-heading{display:flex;justify-content:space-between;padding:12px 16px;background:#24262b;border-bottom:1px solid #3a3b40;font-size:13px}.fit-frame{height:360px;position:relative;overflow:hidden;background:#303030;color:#aaa}.fit-frame>*{position:absolute;transform-origin:top left}.component-wrap{color:#eee}#comparison[data-view=implementation]{grid-template-columns:1fr}#comparison[data-view=implementation] .reference-panel{display:none}#comparison[data-view=reference]{grid-template-columns:1fr}#comparison[data-view=reference] .implementation-panel{display:none}#reference-note{font-size:12px;color:#9fa4ae;padding:8px 16px;min-height:34px}#interaction-note{height:22px;color:#83b7ee;font-size:12px;margin:10px 0}.feedback-section{border-top:1px solid #30343c;padding-top:16px;margin-top:8px}.feedback-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}.feedback-head button{margin-left:auto}.feedback-head label{font-size:14px}#feedback{width:100%;height:80px;resize:vertical;border:1px solid #444852;border-radius:7px;background:#1a1c20;padding:12px;color:#eee;font-size:13px}footer{font-size:12px;color:#858c99;line-height:1.8;margin-top:14px}@media(max-width:1000px){.layout{grid-template-columns:170px 1fr}main{padding:18px}.fit-frame{height:300px}#comparison{grid-template-columns:1fr}header.review-header span{display:none}}@@COMPONENT_CSS@@</style></head><body><header class="review-header"><strong>HC 公共组件 · 视觉评审</strong><span>10 组组件 / 状态切换 / 原素材对照</span><a href="review.html">返回已确认的首页</a></header><div class="layout"><nav id="categories" aria-label="组件分类"></nav><main><div class="top-row"><div><h1 id="component-title"></h1><p id="component-summary"></p></div><span id="dimensions" class="small"></span></div><div id="states" aria-label="组件状态"></div><div class="comparison-controls"><button data-view="split" aria-pressed="true">并排对照</button><button data-view="implementation" aria-pressed="false">仅看实现</button><button data-view="reference" aria-pressed="false">仅看原素材</button><label><input id="actual-size" type="checkbox" checked> 小组件不放大</label></div><div id="comparison" data-view="split"><article class="implementation-panel"><div class="preview-heading"><strong>组件实现</strong><span>可切换状态</span></div><div id="component-stage" class="fit-frame"></div><div style="height:34px"></div></article><article class="reference-panel"><div class="preview-heading"><strong>提供的原素材</strong><span>静态参考</span></div><div id="reference-stage" class="fit-frame"></div><div id="reference-note"></div></article></div><p id="interaction-note" aria-live="polite"></p><section class="feedback-section"><div class="feedback-head"><label for="feedback">当前组件 / 状态的修改意见</label><span id="saved" class="small"></span><button id="export-feedback">导出全部意见</button></div><textarea id="feedback" placeholder="例如：标题应左移 4px；边框颜色偏亮；正常态图标需要调整…"></textarea></section><footer>这一轮只确认公共组件的视觉和状态表现，不接自动故事线。组合状态的示例数值保持不变，不代表业务状态变化。<br>底图和图标直接使用你提供的素材；标题、数值、选择与输入等动态内容由组件生成。意见保存在当前浏览器，导出后可发给我。</footer></main></div><script>const HC_ASSETS=@@ASSETS@@;</script><script>@@COMPONENT_JS@@</script><script>@@GALLERY_JS@@</script></body></html>
