<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首页样板 · 视觉对照</title><style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{height:64px;border-bottom:1px solid #333;display:flex;align-items:center;gap:12px;padding:0 22px}header strong{margin-right:auto;font-size:16px}button,a{font:inherit;color:#ddd;background:#292929;border:1px solid #444;border-radius:6px;padding:8px 12px;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#174777;border-color:#5098e2;color:white}#viewport{position:relative;overflow:hidden;width:100%;height:calc(100vh - 116px);background:#080808}#canvas{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:top left}iframe,#reference{position:absolute;inset:0;width:1920px;height:1080px;border:0}#reference{display:none;pointer-events:none}footer{height:52px;display:flex;align-items:center;gap:20px;padding:0 22px;font-size:12px;color:#aaa}#blend{display:none;align-items:center;gap:8px}input{accent-color:#78adf1;width:130px}#status{white-space:nowrap}.scope{margin-left:auto}#canvas[data-mode=reference] #reference{display:block;opacity:1}#canvas[data-mode=overlay] #reference{display:block;opacity:.5}#canvas[data-mode=reference] iframe{visibility:hidden}@media(max-width:900px){header{gap:6px;padding:0 10px}header strong{font-size:13px}button,a{padding:8px;font-size:12px}.scope{display:none}}
</style><link rel="stylesheet" href="annotations.css"></head><body><header><strong>首页样板 v1 · 视觉对照</strong><button data-mode="implementation" aria-pressed="true">实现效果</button><button data-mode="reference" aria-pressed="false">高保真原图</button><button data-mode="overlay" aria-pressed="false">叠加对照</button><label id="blend">原图透明度 <input id="alpha" type="range" min="0" max="100" value="50" aria-label="高保真原图透明度"></label><a href="首页样板.html" target="_blank">单独打开</a><a href="首页样板.html" download>下载单文件</a></header><section id="viewport"><div id="canvas" data-mode="implementation"><iframe src="首页样板.html" title="首页实现效果"></iframe><img id="reference" src="assets/reference.png" alt="用户提供的首页基础设施故障数高保真"></div></section><footer><span id="status">1920 × 1080 · 等比显示</span><span>可体验：待办/节能 Tab、时间范围、故障/隐患选择、问答输入、时间轴悬停。</span><span class="scope">其他入口暂未接入；优先检查视觉。</span></footer><script>
const canvas=document.getElementById('canvas'),viewport=document.getElementById('viewport'),reference=document.getElementById('reference');function fit(){const scale=Math.min(viewport.clientWidth/1920,viewport.clientHeight/1080);canvas.style.transform=`scale(${scale})`;canvas.style.left=`${(viewport.clientWidth-1920*scale)/2}px`;canvas.style.top=`${(viewport.clientHeight-1080*scale)/2}px`;document.getElementById('status').textContent=`1920 × 1080 · 显示比例 ${Math.round(scale*100)}%`}addEventListener('resize',fit);fit();document.querySelectorAll('[data-mode]').forEach(button=>{if(button.tagName!=='BUTTON')return;button.addEventListener('click',()=>{canvas.dataset.mode=button.dataset.mode;document.querySelectorAll('button[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.getElementById('blend').style.display=button.dataset.mode==='overlay'?'flex':'none';reference.style.opacity=button.dataset.mode==='overlay'?document.getElementById('alpha').value/100:1})});document.getElementById('alpha').addEventListener('input',e=>reference.style.opacity=e.target.value/100);
</script><script src="annotations.js"></script></body></html>
